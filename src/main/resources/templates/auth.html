<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>가족 별장 · 로그인</title>
    <link rel="stylesheet" href="/assets/app.css" />
    <script defer src="/assets/app.js"></script>
  </head>
  <body class="auth-page" th:attr="data-mode=${mode}">
    <main class="auth-shell">
      <section class="auth-intro">
        <a class="brand" href="/">VILLA <span>우리 가족의 별장</span></a>
        <p class="eyebrow">A PLACE TOGETHER</p>
        <h1>함께 쉬는 곳,<br />편하게 나누는 시간.</h1>
        <p>가능한 날짜를 확인하고,<br />가족의 다음 쉼을 준비하세요.</p>
        <div class="house-art" aria-hidden="true">
          <div class="roof"></div>
          <div class="house"><i></i><i></i><i></i></div>
          <div class="ground"></div>
        </div>
        <p class="quiet">가족 구성원만 이용하는 비공개 예약 공간입니다.</p>
      </section>
      <section class="auth-card">
        <p class="eyebrow">WELCOME HOME</p>
        <h2
          th:text="${mode == 'signup' ? '가족으로 참여하기' : (mode == 'reset' ? '비밀번호 재설정' : '다시 오셨네요')}"
        ></h2>
        <p
          th:text="${mode == 'signup' ? '초대코드로 가입한 후 관리자의 승인을 기다려 주세요.' : (mode == 'reset' ? '관리자에게 본인 확인 후 받은 코드를 입력하세요.' : '관리자 승인이 완료된 계정으로 로그인하세요.')}"
        ></p>
        <form id="auth-form">
          <label th:if="${mode != 'reset'}"
            >아이디<input
              name="loginId"
              autocomplete="username"
              required
              maxlength="50"
              placeholder="영문·숫자 아이디" /></label
          ><label th:if="${mode == 'signup'}"
            >이름<input
              name="name"
              autocomplete="name"
              required
              maxlength="30" /></label
          ><label th:if="${mode == 'signup'}"
            >초대코드<input
              name="inviteCode"
              required
              maxlength="100"
              autocomplete="off" /></label
          ><label th:if="${mode == 'reset'}"
            >재설정 코드<input
              name="token"
              required
              maxlength="100"
              autocomplete="off" /></label
          ><label
            >비밀번호<input
              name="password"
              type="password"
              required
              th:attr="autocomplete=${mode == 'login' ? 'current-password' : 'new-password'},minlength=${mode == 'login' ? 1 : 12}"
              maxlength="72"
          /></label>
          <p class="hint" th:if="${mode != 'login'}">
            12자 이상, UTF-8 기준 72바이트 이하로 입력하세요.
          </p>
          <label th:if="${mode == 'signup'}"
            >가입 메모 <span class="quiet">선택</span
            ><textarea
              name="signupNote"
              maxlength="500"
              placeholder="어느 가족인지 짧게 알려주세요. 민감한 개인정보는 적지 마세요."
            ></textarea>
          </label>
          <p
            id="form-message"
            class="message"
            role="status"
            aria-live="polite"
          ></p>
          <button
            class="primary wide"
            type="submit"
            th:text="${mode == 'signup' ? '가입 신청하기' : (mode == 'reset' ? '비밀번호 변경하기' : '로그인')}"
          ></button>
        </form>
        <div class="auth-links">
          <a href="/signup" th:if="${mode == 'login'}"
            >초대받으셨나요? 가입하기</a
          ><a href="/reset" th:if="${mode == 'login'}">비밀번호를 잊으셨나요?</a
          ><a href="/login" th:if="${mode != 'login'}">로그인으로 돌아가기</a>
        </div>
      </section>
    </main>
  </body>
</html>
