<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>가족 별장 · 로그인</title>
    <link rel="stylesheet" href="/assets/app.css" />
    <script type="module" src="/assets/app.js"></script>
  </head>
  <body class="auth-page" th:attr="data-mode=${mode}">
    <main class="auth-shell">
      <section class="auth-intro">
        <a class="brand" href="/">VILLA <span>우리 가족의 별장</span></a>
        <h1>가족 별장 예약</h1>
        <p>별장 이용 일정을 확인하고 예약할 수 있습니다.</p>
        <div class="house-art" aria-hidden="true">
          <div class="roof"></div>
          <div class="house"><i></i><i></i><i></i></div>
          <div class="ground"></div>
        </div>
        <p class="quiet">가족 전용입니다. 가입하려면 초대코드가 필요합니다.</p>
      </section>
      <section class="auth-card">
        <h2
          th:text="${mode == 'signup' ? '회원가입' : (mode == 'reset' ? '비밀번호 재설정' : '로그인')}"
        ></h2>
        <p
          th:text="${mode == 'signup' ? '초대코드를 입력해 신청하면 관리자가 확인 후 승인합니다.' : (mode == 'reset' ? '관리자에게 받은 재설정 코드를 입력해 주세요.' : '가입한 아이디와 비밀번호를 입력해 주세요.')}"
        ></p>
        <form id="auth-form">
          <label th:if="${mode != 'reset'}"
            >아이디<input
              name="loginId"
              autocomplete="username"
              required
              maxlength="50"
              placeholder="영문·숫자 아이디" /></label
          ><label th:if="${mode == 'signup'}"
            >이름<input
              name="name"
              autocomplete="name"
              required
              maxlength="30" /></label
          ><label th:if="${mode == 'signup'}"
            >초대코드<input
              name="inviteCode"
              required
              maxlength="100"
              autocomplete="off" /></label
          ><label th:if="${mode == 'reset'}"
            >재설정 코드<input
              name="token"
              required
              maxlength="100"
              autocomplete="off" /></label
          ><label
            >비밀번호<input
              name="password"
              type="password"
              required
              th:attr="autocomplete=${mode == 'login' ? 'current-password' : 'new-password'},minlength=${mode == 'login' ? 1 : 12}"
              maxlength="72"
          /></label>
          <p class="hint" th:if="${mode != 'login'}">
            12자 이상, UTF-8 기준 72바이트 이하로 입력하세요.
          </p>
          <label th:if="${mode == 'signup'}"
            >가입 메모 <span class="quiet">선택</span
            ><textarea
              name="signupNote"
              maxlength="500"
              placeholder="관리자가 알아볼 수 있도록 가족 관계 등을 적어 주세요. 연락처 같은 개인정보는 적지 않아도 됩니다."
            ></textarea>
          </label>
          <p
            id="form-message"
            class="message"
            role="status"
            aria-live="polite"
          ></p>
          <button
            class="primary wide"
            type="submit"
            th:text="${mode == 'signup' ? '가입 신청하기' : (mode == 'reset' ? '비밀번호 변경하기' : '로그인')}"
          ></button>
        </form>
        <div class="auth-links">
          <a href="/signup" th:if="${mode == 'login'}"
            >초대코드로 회원가입</a
          ><a href="/reset" th:if="${mode == 'login'}">비밀번호를 잊으셨나요?</a
          ><a href="/login" th:if="${mode != 'login'}">로그인으로 돌아가기</a>
        </div>
      </section>
    </main>
  </body>
</html>
