# Use with postgres. Render terminates TLS; only its private proxy hop is trusted.
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXY_REGEX:10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}}
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.threads.max=24
server.tomcat.threads.min-spare=2
server.tomcat.accept-count=50
# Bound inbound concurrency on the free instance. Restarts still require login again.
server.tomcat.max-connections=128
server.servlet.session.cookie.secure=true
