# Dedicated schema: never scan the legacy MySQL migrations on PostgreSQL.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-init-sql=SET search_path TO villa
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.properties.hibernate.default_schema=villa
spring.flyway.locations=classpath:db/postgresql
spring.flyway.default-schema=villa
spring.flyway.schemas=villa
# The migration account creates/owns this schema during provisioning.
spring.flyway.create-schemas=false
spring.flyway.clean-disabled=true
