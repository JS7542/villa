name: Verify service
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  mysql-integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - timezone: UTC
            artifact: utc
          - timezone: Asia/Seoul
            artifact: seoul
    services:
      mysql:
        image: mysql:8.4.9
        env:
          MYSQL_ROOT_PASSWORD: integration-only-password
          MYSQL_DATABASE: villa_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    env:
      TEST_TIME_ZONE: ${{ matrix.timezone }}
      TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/villa_test?connectionTimeZone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      TEST_DB_USERNAME: root
      TEST_DB_PASSWORD: integration-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: chmod +x gradlew
      - run: ./gradlew test bootJar --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.artifact }}
          path: build/reports/tests/test
