name: Verify Docker deployment
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.9
        env:
          MYSQL_ROOT_PASSWORD: integration-only-password
          MYSQL_DATABASE: villa_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r fastapi/requirements-dev.txt
      - run: ruff check fastapi
      - run: ruff format fastapi --check
      - run: python -m pytest fastapi/tests -q
      - name: Test MySQL init SQL and concurrent bookings
        env:
          TEST_DATABASE_URL: mysql+pymysql://root:integration-only-password@127.0.0.1:3306/villa_test
        run: python -m pytest fastapi/tests -q
      - name: Verify generated init SQL is current
        run: |
          PYTHONPATH=fastapi python scripts/generate-schema.py
          git diff --exit-code -- mysql/init mysql/upgrade
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test

  compose:
    runs-on: ubuntu-latest
    env:
      MYSQL_PASSWORD: ci-runtime-password
      MYSQL_ROOT_PASSWORD: ci-root-password
      BOOTSTRAP_ENABLED: "true"
      BOOTSTRAP_LOGIN_ID: admin
      BOOTSTRAP_PASSWORD: ci-administrator-password
      VILLA_MAX_GUESTS: "8"
      HTTP_PORT: "8080"
      IMAGE_PREFIX: villa
      IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@v4
      - name: Build and start all three images
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Exercise deployed HTTP stack
        run: python3 scripts/smoke.py
      - name: Check persisted service logs
        run: |
          sudo test -s logs/mysql/error.log
          sudo test -s logs/mysql/entrypoint.log
          sudo test -s logs/nginx/access.log
          sudo test -s logs/fastapi/app.log
          sudo test -s logs/fastapi/access.log
          sudo test -f logs/nginx/error.log
          sudo test -f logs/mysql/slow.log
          sudo test -f logs/fastapi/error.log
      - name: Recreate containers and check persistent data
        run: |
          docker compose down
          docker compose up -d --no-build --wait --wait-timeout 240
          docker compose exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_PASSWORD" mysql -u"$MYSQL_USER" "$MYSQL_DATABASE" -Nse "SELECT COUNT(*) FROM board_posts WHERE title=\"Compose smoke\""' | grep -qx 1
          curl --fail http://127.0.0.1:8080/health/ready
      - name: Diagnostics
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --tail=100
      - name: Stop test stack
        if: always()
        run: docker compose down -v
