user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format villa escape=json '{"timestamp":"$time_iso8601","request_id":"$request_id",'
        '"remote_addr":"$remote_addr","method":"$request_method","path":"$uri",'
        '"status":$status,"duration":$request_time,"bytes":$body_bytes_sent}';
    access_log /var/log/nginx/access.log villa;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 64k;
    # Docker DNS refreshes the upstream after a FastAPI container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    include /etc/nginx/conf.d/*.conf;
}
