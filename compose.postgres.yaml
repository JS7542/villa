# Disposable LOCAL PostgreSQL for tests. No volumes or production credentials.
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: villa_test
      POSTGRES_USER: villa_test
      POSTGRES_PASSWORD: local-test-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U villa_test -d villa_test"]
      interval: 5s
      timeout: 3s
      retries: 20
