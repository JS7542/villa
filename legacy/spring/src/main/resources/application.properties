spring.application.name=villa
server.port=${PORT:61228}
spring.config.import=optional:application-secret.properties
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.thymeleaf.cache=true
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
logging.level.org.hibernate.orm.jdbc.bind=OFF
villa.booking.advance-days=90
villa.booking.max-days=3
villa.booking.max-active=2
villa.booking.max-guests=${VILLA_MAX_GUESTS:0}
villa.bootstrap.enabled=${BOOTSTRAP_ENABLED:false}
villa.bootstrap.login-id=${BOOTSTRAP_LOGIN_ID:}
villa.bootstrap.password=${BOOTSTRAP_PASSWORD:}
