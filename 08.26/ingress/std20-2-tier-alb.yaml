# nginx | default.conf 정의
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: std20-conf-configmap
data:
  default.conf: |
    charset utf-8;

    server {
        listen 80;
        server_name _; # ALB를 통해 들어오므로 모든 호스트 허용

        # 클라이언트 실제 IP 및 프로토콜 전달 설정
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; # ALB가 보낸 프로토콜(https) 전달

        # 1. 프론트엔드 정적 파일
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }


# -----------------------
# nginx Deployment 정의
# -----------------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: std20-web-deployment
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: std20-web
# -----------------------
# pod와 리소스 정의
# -----------------------
  template:
    metadata:
      labels:
        app: std20-web
    spec:
      containers:
      - name: std20-web-container
        image: nginx:1.31.3-alpine
        ports:
          - containerPort: 80
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
# -----------------------
# 헬스 체크
# -----------------------
        livenessProbe:                # 컨테이너 살아있는지를 지속적으로 확인
          httpGet:                 
            path: /                   # 헬스 체크를 위해 요청을 보낼 경로
            port: 80                  # 헬스 체크를 위해 요청을 보낼 포트
          initialDelaySeconds: 30     # 컨테이너가 시작되고 나서 헬스 체크를 시작하기 전까지의 대기 시간
          periodSeconds: 10           # 헬스 체크를 수행하는 주기 (초 단위)
        readinessProbe:               # 컨테이너가 준비되었는지를 지속적으로 확인      
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5         
# -----------------------
# 볼륨 정의
# -----------------------
        volumeMounts:
          - name: std20-html-volume
            mountPath: /usr/share/nginx/html/index.html
            subPath: index.html

          - name: std20-conf-volume
            mountPath: /etc/nginx/conf.d/default.conf
            subPath: default.conf

      volumes:
        - name: std20-html-volume
          configMap:
            name: std20-html-configmap

        - name: std20-conf-volume
          configMap:
            name: std20-conf-configmap


# -----------------------
# nginx HPA(Horizontal Pod Autoscaler)
# -----------------------
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: std20-web-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: std20-web-deployment
  minReplicas: 1          # Pod의 최소 갯수
  maxReplicas: 3          # Pod의 최대 갯수
  metrics:
    - type: Resource      # Resource(Pod의 CPU or Memory사용률을 기준으로 스케일링),Pod(특정 Pod의 CPU or Memory사용률을 기준으로 스케일링),
                          # Object(Ingress-ALB로 들어오는 요청 수), External(AWS SQS 등 외부 지표)
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80


# -----------------------
# nginx lb service 정의
# -----------------------
---
apiVersion: v1
kind: Service
metadata:
  name: std20-web-service
spec:
  type: ClusterIP   # 외부에서의 접속을 막기 위해.
  selector:
    app: std20-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80








