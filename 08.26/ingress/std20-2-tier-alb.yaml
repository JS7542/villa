# FastAPI | main.py 정의
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: std20-fastapi-code
data:
  main.py: |
    from fastapi import FastAPI, Request, HTTPException
    from fastapi.responses import HTMLResponse
    from fastapi.templating import Jinja2Templates
    from fastapi.staticfiles import StaticFiles
    import os
    import pymysql
    app = FastAPI()
  
    templates = Jinja2Templates(directory="/app/templates")
    DB_CONFIG = {
        "host": os.environ["DB_HOST"],
        "user": os.environ["DB_USER"],
        "password": os.environ["DB_PASSWORD"],
        "database": os.environ["DB_NAME"],
        "port": int(os.environ.get("DB_PORT", "3306")),
        "charset": "utf8mb4",
        "connect_timeout": 5
    }

    def check_rds():

      connection = None

      try:

          connection = pymysql.connect(**DB_CONFIG)

          with connection.cursor() as cursor:
              cursor.execute("SELECT 1")
              cursor.fetchone()

          return True, "RDS MySQL 연결 정상"

      except Exception as e:

          # 실제 오류는 Pod 로그에서 확인
          print(f"RDS connection error: {e}")

          return False, "RDS MySQL 연결 실패"

      finally:

          if connection:
              connection.close()
    # Health Check
    @app.get("/health")
    def health():
        return {
            "status": "ok"
        }

    # Jinja2 Page
    @app.get("/api", response_class=HTMLResponse)
    async def api_page(request: Request):

        db_connected, db_message = check_rds()

        return templates.TemplateResponse(
            request=request,
            name="index.html",
            context={
                "title": "STD20 FastAPI",
                "message": "FastAPI Jinja2 페이지입니다.",
                "db_connected": db_connected,
                "db_message": db_message
            }
        )
    @app.get("/api/db-check")
    def db_check():

        db_connected, db_message = check_rds()

        return {
            "status": "connected" if db_connected else "failed",
            "message": db_message
        }



