# -----------------------
# FastAPI Deployment 정의
# -----------------------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: std20-fastapi-deployment
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: std20-fastapi
  template:
    metadata:
      labels:
        app: std20-fastapi
    spec:
      containers:
      - name: std20-fastapi-container
        image: python:3.12.2-slim

        ports:
          - containerPort: 8000

# -----------------------
# 컨테이너의 command 정의
# -----------------------
        command:
          - /bin/sh
          - -c

        args:
          - |
            set -e

            # FastAPI 및 필요한 Python 패키지 설치
            python -m pip install --no-cache-dir \
              fastapi \
              'uvicorn[standard]' \
              jinja2 \
              pydantic \
              pymysql \
              sshtunnel \
              cryptography \
              boto3 \
              python-dotenv


            echo "===== FastAPI server start ====="

            cd /app

            exec uvicorn main:app \
              --host 0.0.0.0 \
              --port 8000

# -----------------------
# 리소스 정의
# -----------------------
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "600m"
# -----------------------
# 헬스 체크
# -----------------------
        startupProbe:                # 컨테이너가 시작되었는지를 지속적으로 확인
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 10


        livenessProbe:                # 컨테이너 살아있는지를 지속적으로 확인
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3

        readinessProbe:               # 컨테이너가 준비되었는지를 지속적으로 확인
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3


# -----------------------
# 환경 변수 정의
# -----------------------
        env:
          - name: DB_HOST
            valueFrom:
              configMapKeyRef:
                name: std20-mysql-config
                key: DB_HOST
          - name: DB_PORT
            valueFrom:
              configMapKeyRef:
                name: std20-mysql-config
                key: DB_PORT
          - name: DB_NAME
            valueFrom:
              configMapKeyRef:
                name: std20-mysql-config
                key: DB_NAME
          - name: DB_USER
            valueFrom:
              configMapKeyRef:
                name: std20-mysql-config
                key: DB_USER
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: std20-mysql-secret-env
                key: DB_PASSWORD

# -----------------------
# 볼륨 정의
# -----------------------
        volumeMounts:
          - name: std20-fastapi-code-volume
            mountPath: /app/main.py
            subPath: main.py

          - name: std20-fastapi-html-volume
            mountPath: /app/templates/index.html
            subPath: index.html 

      volumes:
        - name: std20-fastapi-code-volume
          configMap:
            name: std20-fastapi-code

        - name: std20-fastapi-html-volume
          configMap:
            name: std20-fastapi-html

# -----------------------
# FastAPI HPA(Horizontal Pod Autoscaler)
# -----------------------
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: std20-fastapi-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: std20-fastapi-deployment
  minReplicas: 2          # Pod의 최소 갯수
  maxReplicas: 6          # Pod의 최대 갯수
  metrics:
    - type: Resource      # Resource(Pod의 CPU or Memory사용률을 기준으로 스케일링),Pod(특정 Pod의 CPU or Memory사용률을 기준으로 스케일링),
                          # Object(Ingress-ALB로 들어오는 요청 수), External(AWS SQS 등 외부 지표)
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80

# -----------------------
# FastAPI Service 정의
# -----------------------
---
apiVersion: v1
kind: Service
metadata:
  name: std20-fastapi-service
spec:
  type: ClusterIP
  selector:
    app: std20-fastapi
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000


    
# -----------------------
# Ingress 정의
# -----------------------
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: std20-alb-ingress

  annotations:

    # 외부 ALB
    alb.ingress.kubernetes.io/scheme: internet-facing

    # ALB -> Pod IP 직접 전달
    alb.ingress.kubernetes.io/target-type: ip

    # HTTP / HTTPS Listener
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'

    # ALB Security Group
    alb.ingress.kubernetes.io/security-groups: sg-040f4c1a77895c0d0,sg-096f1a39a47ff83ad

    # ACM 인증서
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-east-1:925047940866:certificate/84c3701c-2442-40cd-9a64-0c8de938982c

    # HTTP → HTTPS
    alb.ingress.kubernetes.io/ssl-redirect: "443"

spec:
  ingressClassName: alb

  rules:
    - http:
        paths:

          # FastAPI
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: std20-fastapi-service
                port:
                  number: 8000

          # Nginx
          - path: /
            pathType: Prefix
            backend:
              service:
                name: std20-web-service
                port:
                  number: 80